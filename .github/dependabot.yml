version: 2
registries:
  xlib:
    type: maven-repository
    url: https://in2test.lsi.uniovi.es/xlib/maven
updates:
  - package-ecosystem: maven
    directory: "/"
    registries:
      - xlib
    schedule:
      interval: weekly
      day: "friday"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    
